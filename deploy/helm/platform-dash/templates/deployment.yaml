{{- $tag := .Values.image.tag | default .Chart.AppVersion }}
{{- $url := required "url is required (e.g. https://dash.example.com)" .Values.url | trimSuffix "/" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-dash.fullname" . }}
  labels:
    {{- include "platform-dash.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform-dash.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform-dash.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when chart-managed auth settings change.
        checksum/auth: {{ printf "%s|%s|%s|%s" .Values.auth.clientSecret .Values.auth.sessionSecret .Values.auth.existingSecret .Values.auth.issuer | sha256sum }}
    spec:
      serviceAccountName: {{ include "platform-dash.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: platform-dash
          image: "{{ .Values.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default (ternary "Always" "IfNotPresent" (eq $tag "latest")) }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ORIGIN
              value: {{ $url | quote }}
            - name: AUTH_URL
              value: {{ $url | quote }}
            - name: AUTH_OIDC_ISSUER
              value: {{ required "auth.issuer is required" .Values.auth.issuer | quote }}
            - name: AUTH_OIDC_CLIENT_ID
              value: {{ required "auth.clientId is required" .Values.auth.clientId | quote }}
            - name: AUTH_OIDC_PROVIDER_ID
              value: {{ .Values.auth.providerId | quote }}
            - name: AUTH_OIDC_PROVIDER_NAME
              value: {{ .Values.auth.providerName | quote }}
            - name: AUTH_OIDC_SCOPE
              value: {{ .Values.auth.scope | quote }}
            - name: DASH_ROLES_CLAIM
              value: {{ .Values.auth.rolesClaim | quote }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-dash.secretName" . }}
                  key: AUTH_SECRET
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-dash.secretName" . }}
                  key: AUTH_OIDC_CLIENT_SECRET
            - name: DASH_HTTP_TEST_BLOCK
              value: {{ .Values.httpTestBlock | quote }}
            {{- with .Values.grafanaUrl }}
            - name: DASH_GRAFANA_URL
              value: {{ . | quote }}
            {{- end }}
            - name: CLOUDSHELL_SERVICE_ACCOUNT
              value: {{ include "platform-dash.serviceAccountName" . | quote }}
            - name: CLOUDSHELL_TTL_SECONDS
              value: {{ .Values.cloudshell.ttlSeconds | quote }}
            {{- with .Values.cloudshell.image }}
            - name: CLOUDSHELL_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
