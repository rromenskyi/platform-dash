{{- if not .Values.auth.existingSecret }}
{{- $name := include "platform-dash.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := .Values.auth.sessionSecret }}
{{- if and (not $session) $existing }}
{{- $session = index $existing.data "AUTH_SECRET" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform-dash.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ $session | default (randAlphaNum 64) | quote }}
  AUTH_OIDC_CLIENT_SECRET: {{ .Values.auth.clientSecret | quote }}
{{- end }}
